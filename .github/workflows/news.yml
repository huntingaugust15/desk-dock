name: Refresh Dock headlines
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect-news.py
      - scripts/test_news.py
      - scripts/collect-arsenal.py
      - scripts/test_arsenal.py
      - scripts/test-quote-recovery.mjs
      - .github/workflows/news.yml
permissions:
  contents: write
concurrency:
  group: dock-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify feed parsing and failure recovery
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify quote recovery and source validation
        run: node scripts/test-quote-recovery.mjs .
      - name: Collect publisher headlines
        id: tech
        continue-on-error: true
        run: python scripts/collect-news.py
      - name: Collect Arsenal transfer headlines
        id: arsenal
        continue-on-error: true
        run: python scripts/collect-arsenal.py
      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news.json assets/arsenal-transfers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Dock headlines"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report collection failures
        if: steps.tech.outcome == 'failure' || steps.arsenal.outcome == 'failure'
        run: exit 1
