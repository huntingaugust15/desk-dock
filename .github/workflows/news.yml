name: Refresh technology headlines
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect-news.py
      - scripts/test_news.py
      - .github/workflows/news.yml
permissions:
  contents: write
concurrency:
  group: dock-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify feed parsing and failure recovery
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Collect publisher headlines
        run: python scripts/collect-news.py
      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh technology headlines"
          git pull --rebase origin main
          git push origin HEAD:main
